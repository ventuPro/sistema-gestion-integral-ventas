<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">

  <div class="bg-white max-w-md w-full rounded-2xl shadow-xl overflow-hidden">

    <div class="bg-blue-600 p-6 text-center">
      <img *ngIf="ajustes.logo()" [src]="ajustes.logo()" alt="Logo"
           class="h-20 mx-auto mb-3 object-contain rounded-xl bg-white/15 p-2">
      <h1 class="text-3xl font-bold text-white">{{ ajustes.nombre() }}</h1>
      <p class="text-blue-200 mt-1">SGIV · Sistema de Gestión de Inventario y Ventas</p>
    </div>

    <div class="p-8">

      <div *ngIf="mensajeError" role="alert" class="mb-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded text-sm">
        {{ mensajeError }}
      </div>

      <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">Iniciar Sesión</h2>

      <form (ngSubmit)="iniciarSesion()" autocomplete="on">
        <div class="mb-5">
          <label for="correo" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
          <input type="email" id="correo" name="correo" [(ngModel)]="correo" autocomplete="username"
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                 placeholder="admin@sgiv.com">
        </div>

        <div class="mb-5">
          <label for="contrasena" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" [(ngModel)]="contrasena" autocomplete="current-password"
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                 placeholder="••••••••">
        </div>

        <div *ngIf="usaCaptcha" class="mb-6">
          <label for="captcha" class="block text-sm font-medium text-gray-700 mb-1">Verificación: ¿eres una persona?</label>
          <div class="flex items-center gap-2 mb-2">
            <div class="h-14 w-40 rounded-lg border border-gray-200 bg-blue-50 overflow-hidden flex items-center justify-center">
              <img *ngIf="captchaImagen && !cargandoCaptcha" [src]="captchaImagen" alt="Caracteres de verificación"
                   class="h-full w-full select-none pointer-events-none" draggable="false">
              <div *ngIf="cargandoCaptcha" class="w-5 h-5 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
            <button type="button" (click)="cargarCaptcha()" [disabled]="cargandoCaptcha"
                    title="Mostrar otra imagen"
                    class="w-11 h-11 rounded-lg border border-gray-200 text-gray-500 hover:text-blue-600 hover:bg-blue-50 flex items-center justify-center transition-colors disabled:opacity-50">
              <lucide-icon [img]="icons.refrescar" class="w-5 h-5"></lucide-icon>
            </button>
          </div>
          <input type="text" id="captcha" name="captcha" [(ngModel)]="captchaTexto" maxlength="5"
                 autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all tracking-widest"
                 placeholder="Escribe los caracteres de la imagen">
        </div>

        <button type="submit" [disabled]="cargando || (usaCaptcha && cargandoCaptcha)"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-300 disabled:opacity-50 flex justify-center">
          <span *ngIf="!cargando">Ingresar al Sistema</span>
          <span *ngIf="cargando">Verificando...</span>
        </button>
      </form>

    </div>
  </div>
</div>
