server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # Soporte para rutas de Angular (SPA). index.html nunca se guarda en caché:
    # así cada actualización del sistema llega sin tener que borrar el navegador.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # JS/CSS con nombre único por versión (outputHashing): caché larga
    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}